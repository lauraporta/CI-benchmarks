name: bench

# Runs on PRs (like the NIU repos), on push to main, and on manual dispatch so
# you can fire repeated samples on demand.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  bench:
    name: ${{ matrix.os }} py${{ matrix.python-version }} numpyAB run${{ matrix.run }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel siblings: we need the full distribution across legs, not a
      # fail-fast truncation (that truncation is itself a source of the
      # variance we are investigating in the real repo).
      fail-fast: false
      matrix:
        # ARM experiment: the OS gap tracked per-core hardware (M1/Ice Lake
        # fast, Azure EPYC slow), not the torch wheel — so the free arm64
        # runners (Cobalt 100) should run cellpose at M1-class speed, and
        # their homogeneous pool should also remove the machine-lottery
        # variance seen on x86. Python pinned to 3.12; 5 repeats per OS to
        # sample the pool.
        # Torch-regression experiment: same CPU model (EPYC 7763), same
        # cellpose 4.2.1.1, torch 2.12.1 -> 2.13.0 took cellpose from 93.5 s
        # to 228.9 s (and M1 from 29.5 s to 80.9 s). Pin torch as an explicit
        # matrix dimension to confirm within one run. windows-11-arm dropped:
        # pip has no torch wheel for it.
        # numpy A/B: torch 2.12.1 vs 2.13.0 came out identical on the same
        # CPU model, yet the same EPYC 7763 ran cellpose in 93.5 s in July
        # and 228 s now. The other moving part is numpy (2.4.6 -> 2.5.2).
        # Both versions are benchmarked back-to-back IN THE SAME JOB so the
        # machine lottery cannot confound the comparison.
        os: [ubuntu-latest]
        python-version: ["3.12"]
        # Repeat the whole job to sample the runner-luck dimension.
        run: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Benchmark on current numpy (2.5.x)
        run: |
          pytest --benchmark-json=bench-${{ matrix.os }}-py${{ matrix.python-version }}-numpy252-run${{ matrix.run }}.json

      - name: Downgrade numpy to the July version
        run: |
          pip install numpy==2.4.6

      - name: Benchmark on numpy 2.4.6 (same machine)
        run: |
          pytest --benchmark-json=bench-${{ matrix.os }}-py${{ matrix.python-version }}-numpy246-run${{ matrix.run }}.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}-py${{ matrix.python-version }}-numpyAB-run${{ matrix.run }}
          path: bench-*.json

  # Aggregate every leg's JSON into a single summary plot, uploaded as an
  # artifact. Runs even if some bench legs failed.
  plot:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plotting deps
        run: pip install matplotlib

      - name: Download all bench artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Make root-cause figures
        run: python plot_rootcause.py artifacts

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-summary
          path: |
            rootcause_slowness.png
            rootcause_variance.png
