name: pipeline-on-arm

# End-to-end validation of the ARM strategy: run the REAL
# photon-mosaic-pipeline test suite (checked out read-only from upstream)
# on the free arm64 runner, with ubuntu-latest as the x86 control. If the
# arm leg installs cleanly (suite2p-NIU, derotation, datashuttle etc. all
# need aarch64-compatible wheels) and the suite passes in minutes instead
# of hours, the "move integration legs to ubuntu-24.04-arm" recommendation
# is proven on the actual workload, not extrapolated from a microbenchmark.
# Manual-only now: the suite-distribution question is answered (ubuntu
# bimodal by CPU model, windows uniformly slow) and re-firing this 10-job,
# up-to-2.5h matrix on every push to the experiment branch wastes hours.
on:
  workflow_dispatch:

jobs:
  pipeline-tests:
    name: pipeline ${{ matrix.os }} run${{ matrix.run }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 leg removed: blocked by ScanImageTiffReader, which bundles an
        # x86-64-only libScanImageTiffReaderAPI.so (suite2p-NIU dependency) —
        # confirmed by run 32869548446. This phase samples the suite-level
        # time distribution instead: EPYC 9V74 did the full suite in 20 min
        # here while the real repo's Aug-10 CI took 121-145 min on the same 5
        # integration tests — so machine model alone does not explain the
        # blow-ups. 5 repeats per OS to see whether pip-installed runs ever
        # reproduce the 2-hour legs.
        os: [ubuntu-latest, windows-latest]
        run: [1, 2, 3, 4, 5]

    steps:
      - name: Check out photon-mosaic-pipeline (read-only)
        uses: actions/checkout@v4
        with:
          repository: photon-mosaic/photon-mosaic-pipeline

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Print CPU model
        shell: bash
        run: |
          cat /proc/cpuinfo | grep -m1 -E "model name|Model" || true
          nproc || true
          echo "NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS" || true

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the full test suite
        run: |
          pytest -v --durations=15
